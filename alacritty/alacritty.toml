[general]
import = [
    "~/.config/alacritty/themes/themes/campbell.toml"
]


[font]
size = 14

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"

[window]
startup_mode = "Maximized"
